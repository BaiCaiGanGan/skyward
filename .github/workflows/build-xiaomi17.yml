name: Build Xiaomi 17 (pudding)

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/build-xiaomi17.yml"
      - ".github/actions/setup/**"
      - "crates/**"
      - "devices/pudding.toml"
      - "resources/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DEVICE: pudding

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Lint host targets
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --locked --workspace

      - name: Lint Android targets
        run: cargo ndk -t arm64-v8a --platform 30 clippy --locked -p skyward -p skyward-install -p skyward-systems -p skyward-system-init -- -D warnings

  tools:
    name: Build Skyward tools
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build recovery service for arm64 Android
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward

      - name: Build static system-init
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward-system-init --target-dir target/system-init

      - name: Build host packer
        run: cargo build --locked --release -p skyward-pack

      - name: Collect build tools
        run: |
          mkdir -p tools
          cp target/aarch64-linux-android/release/skyward tools/
          cp target/release/skyward-pack tools/
          cp target/system-init/aarch64-linux-android/release/system-init tools/

      - uses: actions/upload-artifact@v7
        with:
          name: xiaomi17-tools
          path: tools/
          if-no-files-found: error
          retention-days: 1

  recovery:
    name: Package Xiaomi 17 recovery
    needs: [check, tools]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: xiaomi17-tools
          path: tools

      - name: Make tools executable
        run: chmod +x tools/skyward tools/skyward-pack tools/system-init

      - name: Read stock firmware metadata
        id: stock
        run: tools/skyward-pack stock --config "devices/${DEVICE}.toml" >> "$GITHUB_OUTPUT"

      - name: Restore cached stock recovery
        id: cache
        uses: actions/cache@v6
        with:
          path: stock/recovery.img
          key: stock-recovery-${{ steps.stock.outputs.recovery }}

      - name: Create stock recovery image
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p stock
          tools/skyward-pack stock --config "devices/${DEVICE}.toml" --out stock/recovery.img

      - name: Verify stock recovery SHA-256
        env:
          RECOVERY_SHA256: ${{ steps.stock.outputs.recovery }}
        run: echo "$RECOVERY_SHA256  stock/recovery.img" | sha256sum --check

      - name: Pack Xiaomi 17 recovery image
        id: pack
        env:
          STOCK_VERSION: ${{ steps.stock.outputs.version }}
        run: |
          version="${GITHUB_SHA::7}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
          fi
          name="skyward-$version-$DEVICE-$STOCK_VERSION"
          mkdir -p out
          tools/skyward-pack recovery \
            --stock stock/recovery.img \
            --binary tools/skyward \
            --system-init tools/system-init \
            --config "devices/$DEVICE.toml" \
            --font resources/fonts/MiSansVF.ttf \
            --mono resources/fonts/KirkMono-Regular.ttf \
            --mono-license resources/fonts/KirkMono-OFL.txt \
            --out "out/$name.img"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Zip recovery image
        working-directory: out
        env:
          NAME: ${{ steps.pack.outputs.name }}
        run: zip -9 "$NAME.zip" "$NAME.img"

      - name: Generate checksum
        working-directory: out
        env:
          NAME: ${{ steps.pack.outputs.name }}
        run: sha256sum "$NAME.zip" > SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.name }}
          path: |
            out/${{ steps.pack.outputs.name }}.zip
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
